<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareTrack | Quarantine facility</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172b3b;font:15px system-ui,sans-serif}header{background:#123b48;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header b{font-size:24px}small{color:#647787}header small{color:#b9d6dc}main{max-width:1200px;margin:auto;padding:28px 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select,input,textarea{font:inherit;border:1px solid #c8d6df;border-radius:8px;padding:10px 12px}button{cursor:pointer;background:white;color:#123b48}button.primary,button.active{background:#087e82;color:white;border-color:#087e82}button:disabled{opacity:.4;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}.card,section{background:white;border:1px solid #dce5eb;border-radius:12px;padding:20px}.card strong{display:block;font-size:30px;margin-top:8px}h1,h2{margin:0 0 10px}h2{font-size:19px}.table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}td,th{padding:13px 10px;border-bottom:1px solid #e5edf1}th{font-size:12px;text-transform:uppercase;color:#647787}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#e3f4ed;color:#176a49;font-size:12px}.warn{background:#fff1d7;color:#885500}.bad{background:#ffe5e5;color:#a32424}.muted{color:#647787}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.notice{padding:12px;background:#e6f4f5;border-radius:8px;margin:12px 0}dialog{border:0;border-radius:15px;width:min(560px,95vw);padding:24px;box-shadow:0 15px 70px #0004}dialog::backdrop{background:#123b4877}label{display:block;margin:12px 0}label input,label textarea,label select{display:block;width:100%;margin-top:5px}footer{padding:20px;color:#647787;font-size:12px} .right{float:right} @media(max-width:600px){main{padding:15px}section{padding:12px}}
</style><header><div><b>✚ CareTrack</b><br><small>Quarantine & treatment facility · MVP</small></div><div><small>Demo role</small> <select id="role" onchange="changeRole(this.value)"><option>Nurse</option><option>Doctor</option><option>Admin</option><option>Head Doctor</option></select></div></header><main><div id="app"></div><footer>Assessment prototype · Fictional data only · Browser-local storage · Not for clinical use <button class="right" onclick="reset()">Reset demo</button></footer></main><dialog id="modal"></dialog><script>
const $=id=>document.getElementById(id), key='caretrack-v1';let role='Nurse',tab='queue',filter='all',query='';const date=(offset=0)=>{let d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const today=()=>date();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function seed(){return {patients:Array.from({length:74},(_,i)=>({id:i+1,name:['Alex Morgan','Jamie Chen','Sam Patel','Taylor Reed','Jordan Lee','Casey Brown'][i]||'Demo Patient '+String(i+1).padStart(2,'0'),room:i+1,status:'Active',admitted:date(-5),temps:i===0?[-3,-2,-1].map(n=>({day:date(n),value:36.7})):i===1?[{day:today(),value:38.5}]:i===2?[{day:today(),value:37}]:[],visits:i===2?[{day:today(),note:'Routine review completed'}]:[],approved:false})).concat(Array.from({length:20},(_,i)=>({id:75+i,name:'Past patient '+(i+1),room:null,status:i<4?'Deceased':'Discharged',admitted:date(-15),temps:[],visits:[],approved:false}))),next:95}}let state;try{state=JSON.parse(localStorage.getItem(key))||seed()}catch{state=seed()}function save(){localStorage.setItem(key,JSON.stringify(state));render()}function reset(){if(confirm('Reset all demo changes?')){state=seed();save()}}function changeRole(r){role=r;tab='queue';filter='all';query='';render()}const active=()=>state.patients.filter(p=>p.status==='Active');const measured=p=>p.temps.find(t=>t.day===today());const visited=p=>p.visits.some(v=>v.day===today());function streak(p){let n=0;for(let i=-1;i>=-365;i--){let t=p.temps.filter(t=>t.day===date(i));if(!t.length||t.some(x=>x.value>=38))break;n++}return n}const eligible=p=>p.status==='Active'&&streak(p)>=3&&!p.temps.some(t=>t.day===today()&&t.value>=38);const clinician=()=>role==='Doctor'||role==='Head Doctor';const pill=(s,c='')=>`<span class="pill ${c}">${s}</span>`;const card=(s,n)=>`<div class="card"><small>${s}</small><strong>${n}</strong></div>`;function go(t){tab=t;filter='all';query='';render()}function render(){let a=active(),pending=a.filter(p=>!measured(p)).length,ready=a.filter(p=>measured(p)&&!visited(p)).length,approved=a.filter(p=>p.approved&&eligible(p)).length,dead=state.patients.filter(p=>p.status==='Deceased').length,recovered=state.patients.filter(p=>p.status==='Discharged').length,rate=dead+recovered?dead/(dead+recovered)*100:null;let tabs=[['queue','Daily workflow'],['patients','Patient records']];if(role==='Admin')tabs.push(['rooms','Rooms & admissions'],['discharges','Discharge queue']);if(clinician())tabs.push(['discharges','Discharge review']);if(role==='Head Doctor')tabs.push(['metrics','Performance']);let html=`<h1>${role} dashboard</h1><div class="muted">${today()} · ${role==='Nurse'?'Record temperatures and complete daily checks':role==='Admin'?'Manage capacity and patient movement':'Review patient care and recovery'}</div><div class="cards">${card('Occupied beds',a.length+' / 74')}${card('Temperature pending',pending)}${card('Ready for doctor',ready)}${card('Approved discharges',approved)}</div><nav>${tabs.map(([t,l])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${l}</button>`).join('')}</nav>`;if(tab==='metrics'){html+=`<section><h2>Treatment outcomes</h2>${rate>15?'<div class="notice bad">⚠ Mortality exceeds the 15% benchmark. Review treatment outcomes.</div>':''}<div class="cards">${card('Mortality · target ≤15%',rate===null?'—':rate.toFixed(1)+'%')}${card('Recovery · target ≥85%',rate===null?'—':(100-rate).toFixed(1)+'%')}${card('Recovered',recovered)}${card('Deceased',dead)}${card('Temperature completion',a.length?Math.round((a.length-pending)/a.length*100)+'%':'—')}${card('Visit completion',a.length?Math.round(a.filter(visited).length/a.length*100)+'%':'—')}</div><p class="muted">Rates use completed outcomes only (${dead+recovered} patients); active patients are excluded.</p></section>`}else if(tab==='rooms'){html+=`<section><h2>Room allocation <button class="primary right" onclick="admit()" ${a.length>=74?'disabled':''}>+ Admit patient</button></h2><p>${74-a.length} available beds</p><div class="cards">${Array.from({length:74},(_,i)=>{let p=a.find(x=>x.room===i+1);return `<div class="card">Room ${i+1}<br>${p?pill(esc(p.name),'warn'):pill('Available')}</div>`}).join('')}</div></section>`}else{let list=tab==='patients'?state.patients:tab==='discharges'?a.filter(p=>role==='Admin'?p.approved&&eligible(p):eligible(p)):a;list=list.filter(p=>(p.name+' '+p.room).toLowerCase().includes(query.toLowerCase())&&(filter==='all'||(filter==='pending'&&!measured(p))||(filter==='ready'&&measured(p)&&!visited(p))||(filter==='visited'&&visited(p))));html+=`<section><h2>${tab==='discharges'?'Discharge queue':tab==='patients'?'Patient records':'Daily patient workflow'}</h2>${tab==='queue'?'<p class="muted">Temperature → doctor visit → discharge review</p>':''}<div class="toolbar"><input placeholder="Search patient or room" value="${esc(query)}" onchange="query=this.value;render()"><select onchange="filter=this.value;render()"><option value="all">All patients</option><option value="pending" ${filter==='pending'?'selected':''}>Temperature pending</option><option value="ready" ${filter==='ready'?'selected':''}>Ready for doctor</option><option value="visited" ${filter==='visited'?'selected':''}>Visited</option></select></div><div class="table"><table><thead><tr><th>Patient</th><th>Room</th><th>Temperature today</th><th>Doctor visit</th><th>Fever-free days</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>PT-${p.id}</small></td><td>${p.room??'—'}</td><td>${role==='Admin'?(measured(p)?pill('Recorded'):pill('Pending','warn')):measured(p)?pill(measured(p).value.toFixed(1)+' °C',measured(p).value>=38?'bad':''):pill('Pending','warn')}</td><td>${visited(p)?pill('Completed'):pill('Pending','warn')}</td><td>${streak(p)}</td><td>${p.status!=='Active'?pill(p.status):p.approved&&eligible(p)?pill('Approved'):eligible(p)?pill('Eligible'):pill('Active')}</td><td><button onclick="detail(${p.id})">Open</button></td></tr>`).join('')||'<tr><td colspan="7">No matching patients.</td></tr>'}</tbody></table></div></section>`} $('app').innerHTML=html}
function show(html){$('modal').innerHTML=html;if(!$('modal').open)$('modal').showModal()}function closeModal(){$('modal').close()}function detail(id){let p=state.patients.find(x=>x.id===id),a=p.status==='Active';show(`<button class="right" onclick="closeModal()">✕</button><h2>${esc(p.name)}</h2><p>PT-${p.id} · Room ${p.room??'—'} · ${p.status}</p><div class="notice">${streak(p)} completed fever-free days · ${eligible(p)?'Eligible for discharge':'Not eligible for discharge'}</div>${role!=='Admin'?`<h2>Temperature history</h2><div class="table"><table>${p.temps.map(t=>`<tr><td>${t.day}</td><td>${t.value.toFixed(1)} °C</td><td>${t.corrected?'Corrected':''}</td></tr>`).join('')||'<tr><td>No readings yet</td></tr>'}</table></div>`:''}${a&&role==='Nurse'?`<form onsubmit="record(event,${id})"><label>${measured(p)?'Correct today’s reading':'Record temperature (°C)'}<input name="temp" type="number" min="30" max="45" step="0.1" required value="${measured(p)?.value??''}"></label>${measured(p)?'<label>Correction reason<input name="reason" required></label>':''}<button class="primary">Save temperature</button></form>`:''}${clinician()?`<h2 style="margin-top:18px">Visit notes</h2>${p.visits.map(v=>`<p>${v.day}: ${esc(v.note)}</p>`).join('')||'<p class="muted">No visits recorded</p>'}${a?`<form onsubmit="visit(event,${id})"><label>Treatment / observation<textarea name="note" required></textarea></label><button class="primary" ${!measured(p)||visited(p)?'disabled':''}>Complete today’s visit</button></form><p><button onclick="approve(${id})" ${!eligible(p)||!visited(p)||p.approved?'disabled':''}>Approve discharge</button> <button onclick="death(${id})">Record death</button></p>`:''}`:''}${a&&role==='Admin'?`<button class="primary" onclick="discharge(${id})" ${!p.approved||!eligible(p)?'disabled':''}>Complete discharge</button>`:''}`)}function record(e,id){e.preventDefault();if(role!=='Nurse')return;let p=state.patients.find(x=>x.id===id),f=new FormData(e.target),v=Number(f.get('temp')),t=measured(p);if(p.status!=='Active'||v<30||v>45)return;if(t){t.audit=[...(t.audit||[]),{old:t.value,reason:f.get('reason'),at:new Date().toISOString()}];t.value=v;t.corrected=true}else p.temps.push({day:today(),value:v});if(!eligible(p))p.approved=false;save();detail(id)}function visit(e,id){e.preventDefault();let p=state.patients.find(x=>x.id===id);if(!clinician()||p.status!=='Active'||!measured(p)||visited(p))return;p.visits.push({day:today(),note:new FormData(e.target).get('note')});save();detail(id)}function approve(id){let p=state.patients.find(x=>x.id===id);if(clinician()&&eligible(p)&&visited(p)){p.approved=true;save();detail(id)}}function death(id){let p=state.patients.find(x=>x.id===id);if(clinician()&&p.status==='Active'&&confirm('Record death and release demo bed?')){p.status='Deceased';p.room=null;p.approved=false;save();closeModal()}}function discharge(id){let p=state.patients.find(x=>x.id===id);if(role==='Admin'&&p.approved&&eligible(p)&&confirm('Complete discharge and release demo bed?')){p.status='Discharged';p.room=null;save();closeModal()}}function admit(){if(role!=='Admin')return;let rooms=Array.from({length:74},(_,i)=>i+1).filter(r=>!active().some(p=>p.room===r));show(`<h2>Admit patient</h2><form onsubmit="register(event)"><label>Patient name<input name="name" required maxlength="80"></label><label>Room<select name="room">${rooms.map(r=>`<option>${r}</option>`).join('')}</select></label><button class="primary" ${rooms.length?'':'disabled'}>Register patient</button> <button type="button" onclick="closeModal()">Cancel</button></form>`)}function register(e){e.preventDefault();let f=new FormData(e.target),room=Number(f.get('room')),name=f.get('name').trim();if(role!=='Admin'||!name||active().length>=74||room<1||room>74||active().some(p=>p.room===room))return;state.patients.push({id:state.next++,name,room,status:'Active',admitted:today(),temps:[],visits:[],approved:false});save();closeModal()}render();</script></html>
